<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapil Sinha, PhD | Building Science & Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-zinc-950 text-slate-200 selection:bg-orange-500/30">

    <!-- Mobile header is populated from resume-data.js so the name/title stay in one place. -->
    <header id="mobile-header" class="md:hidden flex items-center p-4 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-50"></header>

    <!-- Overlay remains structural because it is controlled by the sidebar interaction script. -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/80 z-[55] hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Sidebar content is rendered from the navigation and profile data modules. -->
    <aside id="sidebar" class="fixed left-0 top-0 h-screen w-72 flex flex-col bg-zinc-900 border-r border-zinc-800 p-8 z-[60] -translate-x-full md:translate-x-0"></aside>

    <main class="md:ml-72 p-6 md:p-16 max-w-7xl mx-auto">
        <!-- Resume sections are rendered in order from RESUME_DATA.sectionOrder. -->
        <div id="resume-root"></div>

        <footer class="border-t border-zinc-800 pt-10 text-center text-slate-600 text-xs mono">
            <p id="footer-copyright"></p>
            <p class="mt-2 uppercase tracking-tighter">---------------</p>
        </footer>
    </main>

    <script src="resume-data.js"></script>
    <script src="resume-sections.js"></script>
    <script src="app.js"></script>
</body>
</html>
